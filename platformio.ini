; Focus & Availability Device - PlatformIO build configuration
;
; One board (ESP32-S3 WROOM-1 N16R8), several firmware choices ("environments").
; Pick one with:  make build ENV=<name>   or   pio run -e <name>
;
;   time-prod-app  (default) the firmware: menu / timer / availability + auto-flip
;   test-peripherals         hardware check: I2C scan + display + IMU readout

[platformio]
default_envs = time-prod-app

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; the actual module is N16R8 = 16 MB flash (board default assumes 8 MB)
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
lib_deps =
    olikraus/U8g2
    dfrobot/DFRobot_BMI160
    adafruit/Adafruit NeoPixel

; build_src_filter is an allowlist: a .cpp in src/ that is not matched here is
; silently not compiled, and one matched by two envs breaks both with duplicate
; setup()/loop(). The hardware modules in src/hw/ are header-only, so they need
; no entry - they compile as part of whichever .cpp includes them.
[env:time-prod-app]
build_src_filter = +<main.cpp>

[env:test-peripherals]
build_src_filter = +<test_peripherals.cpp>

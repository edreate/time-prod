; Focus & Availability Device - PlatformIO build configuration
;
; One board (ESP32-S3 WROOM-1 N16R8), several firmware choices ("environments").
; Pick one with:  make build ENV=<name>   or   pio run -e <name>
;
;   esp32-s3              (default) the real firmware: timer + status LEDs +
;                         auto-flip + Wi-Fi settings page  (src/main.cpp)
;   test-bringup          hardware check: I2C scan + display + IMU readout
;   test-orientation      display flips 180 based on IMU accel
;   test-orientation-led  same, plus LED color change on flip

[platformio]
default_envs = esp32-s3

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; the actual module is N16R8 = 16 MB flash (board default assumes 8 MB)
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
lib_deps =
    olikraus/U8g2
    dfrobot/DFRobot_BMI160
    adafruit/Adafruit NeoPixel

[env:esp32-s3]
build_src_filter = +<main.cpp>

[env:test-bringup]
build_src_filter = +<test_bringup.cpp>

[env:test-orientation]
build_src_filter = +<test_orientation.cpp>

[env:test-orientation-led]
build_src_filter = +<test_orientation_led.cpp>

; Focus & Availability Device - PlatformIO build configuration
;
; Two boards during the prototype transition (see docs/prototype-hardware/README.md):
;   *-n16r8   ESP32-S3 WROOM-1 N16R8 devkit - the original breadboard, 16 MB flash
;   *-s3zero  Tenstar/Waveshare ESP32-S3 Zero (ESP32-S3FH4R2) - smaller/cheaper,
;             same MCU family, 4 MB flash / 2 MB quad PSRAM. Unverified until a
;             test-peripherals-s3zero flash confirms it on real hardware.
; Pick one with:  make build ENV=<name>   or   pio run -e <name>
;
;   time-prod-app-n16r8   (default) the firmware, on the original devkit
;   test-peripherals-n16r8       hardware check, on the original devkit
;   time-prod-app-s3zero         the firmware, on the S3 Zero
;   test-peripherals-s3zero      hardware check, on the S3 Zero - flash this first

[platformio]
default_envs = time-prod-app-n16r8

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
    olikraus/U8g2
    dfrobot/DFRobot_BMI160
    adafruit/Adafruit NeoPixel

; build_src_filter is an allowlist: a .cpp in src/ that is not matched here is
; silently not compiled, and one matched by two envs breaks both with duplicate
; setup()/loop(). the hardware and software modules are header-only, so they need
; no entry - they compile as part of whichever .cpp includes them.

; ---- ESP32-S3 WROOM-1 N16R8 (original breadboard devkit) ----
[env:time-prod-app-n16r8]
build_src_filter = +<main.cpp>
; the actual module is N16R8 = 16 MB flash (board default assumes 8 MB)
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

[env:test-peripherals-n16r8]
build_src_filter = +<test_peripherals.cpp>
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

; ---- ESP32-S3 Zero (ESP32-S3FH4R2, 4 MB flash / 2 MB quad PSRAM) ----
; Same GPIO numbering as the N16R8 for the pins this project uses (verified
; against config.h in docs/prototype-hardware/README.md) - src/ is unchanged,
; only the flash size, partition table, and PSRAM mode differ.
[env:time-prod-app-s3zero]
build_src_filter = +<main.cpp>
board_upload.flash_size = 4MB
board_build.partitions = default.csv
board_build.arduino.memory_type = qio_qspi ; quad PSRAM, not the N16R8's octal

[env:test-peripherals-s3zero]
build_src_filter = +<test_peripherals.cpp>
board_upload.flash_size = 4MB
board_build.partitions = default.csv
board_build.arduino.memory_type = qio_qspi
